# Static Atlas3 under /atlas/. chi-hermes's nginx is the only client; it adds
# the security headers and caching policy. Atlas3 routes with the URL hash,
# so no fallback to index.html is needed.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    location = /atlas { return 301 /atlas/; }
    location /atlas/ {
        index index.html;
        try_files $uri $uri/ =404;
    }
    location / { return 404; }
}
