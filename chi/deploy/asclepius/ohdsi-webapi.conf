# WebAPI 3: asclepius.uchealth.com nginx (aquarius, UC Health side).
# Include inside the asclepius.uchealth.com https server block.
#
#   chi-hermes (UC, CHI auth) -> https -> here -> http -> chi-escher:8080
#
# chi-hermes has already authenticated the user and added a signed
# sso-assertion; this hop passes it and the Authorization header through
# unchanged. WebAPI verifies the assertion's signature itself, so a forged
# one is rejected, but only chi-hermes should be able to use this path.
#
# Placeholders: CHI_HERMES_ADDRESS, CHI_ESCHER_HOST.

location /WebAPI/ {
    allow CHI_HERMES_ADDRESS;
    deny all;

    client_max_body_size 50m;
    proxy_read_timeout 300s;
    # WebAPI's JSON 401/403/503 go back to Atlas as they are.
    proxy_intercept_errors off;

    proxy_http_version 1.1;
    proxy_set_header Host chi-tools.uc.edu;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # sso-assertion and Authorization are forwarded by default; don't clear
    # them here (and don't add proxy_set_header lines that drop them).

    proxy_pass http://CHI_ESCHER_HOST:8080/WebAPI/;
}
