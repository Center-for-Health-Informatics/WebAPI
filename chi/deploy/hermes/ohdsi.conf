# Atlas3 + WebAPI 3 on chi-tools.uc.edu: chi-hermes nginx (UC side).
# Include inside the chi-tools.uc.edu server block, which already runs CHI
# auth's auth_request, so every request reaching these locations carries a
# fresh sso-assertion. Replaces the Node WebAPI / old Atlas locations.
#
# Also register both paths as a protected resource in CHI auth: with
# ALLOW_UNLISTED (its default) unlisted paths are served without sign-in.
#
#   browser -> here -> /atlas/  -> chi-cetus (Atlas3, static files)
#                   -> /WebAPI/ -> https asclepius.uchealth.com (aquarius
#                                  nginx) -> http chi-escher:8080 (WebAPI)
#
# Placeholders: CHI_CETUS_ATLAS_PORT.

location = /atlas { return 301 /atlas/; }

location /atlas/ {
    add_header Cache-Control "no-store" always;
    # this level declares an add_header, so it inherits none of the http-level ones
    include snippets/security-headers.conf;
    # Static files only: no sso-assertion is forwarded to chi-cetus.
    include snippets/proxy-headers.conf;
    proxy_pass http://chi-cetus.uc.edu:CHI_CETUS_ATLAS_PORT/atlas/;
}

location /WebAPI/ {
    # Cohort definitions and concept sets post as large JSON.
    client_max_body_size 50m;
    include snippets/proxy-headers.conf;
    include snippets/proxy-headers-sso.conf;
    # WebAPI's own 401/403/503 are JSON for Atlas, not pages for a browser:
    # don't let the server-level error_page turn them into an auth redirect.
    proxy_intercept_errors off;
    # Report and generation endpoints can run for minutes.
    proxy_read_timeout 300s;

    proxy_pass https://asclepius.uchealth.com/WebAPI/;
    # The assertion and WebAPI tokens cross from UC to UC Health here: verify
    # asclepius's certificate rather than accepting any.
    proxy_ssl_server_name on;
    proxy_ssl_name asclepius.uchealth.com;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    # nginx doesn't use the OS trust store unless told to (Ubuntu path). If
    # asclepius uses an internal UC Health CA, point this at that CA instead.
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
}
