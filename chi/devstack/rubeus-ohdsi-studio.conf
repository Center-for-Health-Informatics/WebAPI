# WebAPI 3 + Atlas3 dev stack on studio (chi/devstack in the WebAPI fork).
# Installed on rubeus as /srv/nginx/snippets/ohdsi-studio.conf and included
# from conf.d/dev.conf. Both locations sit behind the server-level
# auth_request, so every request carries a fresh sso-assertion.

location /atlas/ {
    client_max_body_size 50m;
    add_header Cache-Control "no-store" always;
    # this level declares an add_header, so it inherits none of the http-level ones
    include snippets/security-headers.conf;
    include snippets/proxy-headers.conf;
    include snippets/proxy-headers-sso.conf;
    proxy_pass http://studio.lastchance.pub:28527/atlas/;
}

location /WebAPI/ {
    # Cohort definitions and concept sets post as large JSON.
    client_max_body_size 50m;
    include snippets/proxy-headers.conf;
    include snippets/proxy-headers-sso.conf;
    # WebAPI's own 401/403/503 are JSON for Atlas, not pages for a browser:
    # don't let the server-level error_page turn them into an auth redirect.
    proxy_intercept_errors off;
    proxy_read_timeout 300s;
    proxy_pass http://studio.lastchance.pub:28080/WebAPI/;
}
